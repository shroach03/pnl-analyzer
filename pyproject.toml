[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnl-analyzer"
version = "0.1.0"
description = "Monthly P&L review pipeline: intake sweep, per-store analysis against baselines, portfolio report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# reportlab renders the synthetic PDFs; pytest and ruff are the CI checks.
dev = [
    "reportlab>=4.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
