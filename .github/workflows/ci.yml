name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out code and runs tests. Nothing here writes to the repo, issues or packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved; a commit can't). Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # PIP_CONSTRAINT (rather than -c) also pins the isolated build environment, so setuptools is exact too.
      - name: Install exact versions
        env:
          PIP_CONSTRAINT: requirements-ci.txt
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Validate store registry
        run: node tools/validate_registry.js sample-data/seed/stores_registry.json
